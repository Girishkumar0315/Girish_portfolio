<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Great+Vibes&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap");
      .font-sans { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-title { font-family: 'Montserrat', 'Segoe UI', Roboto, sans-serif; }
      .font-script { font-family: 'Great Vibes', 'Brush Script MT', cursive, sans-serif; }
    </style>
    <!-- Background subtle gray angle pattern -->
    <pattern id="diagStripes" width="40" height="40" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#f1f5f9" stroke-width="1.5" />
    </pattern>

    <linearGradient id="purpleRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b2f97" />
      <stop offset="50%" stop-color="#732282" />
      <stop offset="100%" stop-color="#551263" />
    </linearGradient>

    <linearGradient id="purpleRibbonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a1568" />
      <stop offset="100%" stop-color="#3c0b46" />
    </linearGradient>
  </defs>

  <!-- Clean Off-White Background Paper -->
  <rect width="1600" height="1130" fill="#fcfcfd" />

  <!-- Subtle Background Diagonal Grid -->
  <rect width="1600" height="1130" fill="url(#diagStripes)" opacity="0.65" />

  <!-- Subtle Watermark Geometric Polygonal Shapes in Background -->
  <polygon points="0,0 800,0 350,600 0,350" fill="#f8fafc" opacity="0.8" />
  <polygon points="1600,0 800,0 1250,600 1600,350" fill="#f8fafc" opacity="0.8" />
  <polygon points="200,1130 800,600 1400,1130" fill="#f8fafc" opacity="0.6" />

  <!-- Top-Left Subtle Dot Grid Matrix (Matching Screenshot) -->
  <g fill="#cbd5e1" opacity="0.75">
    <circle cx="45" cy="40" r="3.5" /><circle cx="65" cy="40" r="3.5" /><circle cx="85" cy="40" r="3.5" />
    <circle cx="35" cy="60" r="3.5" /><circle cx="55" cy="60" r="3.5" /><circle cx="75" cy="60" r="3.5" /><circle cx="95" cy="60" r="3.5" />
    <circle cx="25" cy="80" r="3.5" /><circle cx="45" cy="80" r="3.5" /><circle cx="65" cy="80" r="3.5" /><circle cx="85" cy="80" r="3.5" /><circle cx="105" cy="80" r="3.5" />
    <circle cx="15" cy="100" r="3.5" /><circle cx="35" cy="100" r="3.5" /><circle cx="55" cy="100" r="3.5" /><circle cx="75" cy="100" r="3.5" /><circle cx="95" cy="100" r="3.5" /><circle cx="115" cy="100" r="3.5" />
    <circle cx="25" cy="120" r="3.5" /><circle cx="45" cy="120" r="3.5" /><circle cx="65" cy="120" r="3.5" /><circle cx="85" cy="120" r="3.5" /><circle cx="105" cy="120" r="3.5" />
    <circle cx="35" cy="140" r="3.5" /><circle cx="55" cy="140" r="3.5" /><circle cx="75" cy="140" r="3.5" /><circle cx="95" cy="140" r="3.5" />
    <circle cx="45" cy="160" r="3.5" /><circle cx="65" cy="160" r="3.5" /><circle cx="85" cy="160" r="3.5" />
  </g>

  <!-- Top Header: Cod[Intern] Brand Logo (Exact replica) -->
  <g transform="translate(800, 110)">
    <!-- CodIntern icon: purple loop with orange/red accent -->
    <g transform="translate(-160, -32)">
      <!-- Main Loop -->
      <path d="M 40 30 C 40 18 28 10 16 14 C 4 18 -2 30 2 44 C 6 58 18 66 32 64 C 46 62 52 50 50 38" fill="none" stroke="#7928ca" stroke-width="12" stroke-linecap="round" />
      <!-- Inner Loop dot / accent in vibrant warm orange/magenta -->
      <circle cx="45" cy="16" r="8" fill="#ff0080" />
      <path d="M 38 24 C 48 30 48 48 36 56" fill="none" stroke="#ff4d4d" stroke-width="10" stroke-linecap="round" />
    </g>

    <!-- Cod[Intern] Text -->
    <text x="-95" y="8" font-family="'Montserrat', sans-serif" font-weight="800" font-size="52" fill="#1e1b4b" letter-spacing="-0.5">
      Cod<tspan fill="#dc2626" font-weight="900">[</tspan><tspan fill="#dc2626">Intern</tspan><tspan fill="#dc2626" font-weight="900">]</tspan>
    </text>

    <!-- Tagline: Skills Ka Naya Adda in Pill -->
    <g transform="translate(42, 22)">
      <rect x="0" y="0" width="138" height="24" rx="4" fill="#4338ca" />
      <text x="69" y="16.5" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11.5" fill="#ffffff" letter-spacing="0.4">
        Skills Ka Naya Adda
      </text>
    </g>
  </g>

  <!-- Main Title: CERTIFICATE OF APPRECIATION -->
  <text x="800" y="295" text-anchor="middle" class="font-title" font-weight="900" font-size="78" fill="#753589" letter-spacing="4">
    CERTIFICATE
  </text>
  <text x="800" y="365" text-anchor="middle" class="font-title" font-weight="800" font-size="40" fill="#1e293b" letter-spacing="3.5">
    OF APPRECIATION
  </text>

  <!-- Subtitle Intro Text -->
  <text x="800" y="440" text-anchor="middle" class="font-sans" font-size="24" fill="#334155" font-weight="500">
    This is to recognize and appreciate
  </text>

  <!-- Candidate Name: Girish Kumar -->
  <text x="800" y="540" text-anchor="middle" class="font-title" font-weight="700" font-size="64" fill="#0f172a" letter-spacing="1">
    Girish Kumar
  </text>
  <!-- Name underline rule -->
  <line x1="400" y1="565" x2="1200" y2="565" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Body Paragraph (Exact text from certificate) -->
  <g class="font-sans" font-size="21.5" fill="#1e293b" text-anchor="middle" font-weight="500">
    <text x="800" y="628">
      For your enthusiastic participation and dedication during <tspan font-weight="800" fill="#0f172a">HACK-ADHYAAY</tspan>, the 24-Hour National Level Hackathon organized by
    </text>
    <text x="800" y="666">
      CodIntern, Vibranta and team on Nov 28-29, 2025. We sincerely appreciate your commitment to innovation, your collaborative
    </text>
    <text x="800" y="704">
      spirit, and the technical skills demonstrated throughout the event. Your contribution helped make this event a success.
    </text>
  </g>

  <!-- Event Date -->
  <text x="800" y="775" text-anchor="middle" class="font-sans" font-weight="700" font-size="22" fill="#0f172a" letter-spacing="1.5">
    28,29 NOV 2025
  </text>

  <!-- Signatures Section -->
  <!-- Left: Gaurav Dwivedi -->
  <g transform="translate(480, 850)" text-anchor="middle" class="font-sans">
    <!-- Signature Line -->
    <line x1="-160" y1="20" x2="160" y2="20" stroke="#475569" stroke-width="2" />

    <!-- Name & Designation -->
    <text x="0" y="58" font-weight="700" font-size="22" fill="#0f172a">Gaurav Dwivedi</text>
    <text x="0" y="86" font-weight="500" font-size="17" fill="#475569">CO-Founder and CEO</text>
    <text x="0" y="110" font-weight="500" font-size="17" fill="#475569">Codintern</text>
  </g>

  <!-- Right: Subham Raj -->
  <g transform="translate(1120, 850)" text-anchor="middle" class="font-sans">
    <!-- Signature Line -->
    <line x1="-160" y1="20" x2="160" y2="20" stroke="#475569" stroke-width="2" />

    <!-- Name & Designation -->
    <text x="0" y="58" font-weight="700" font-size="22" fill="#0f172a">Subham Raj</text>
    <text x="0" y="86" font-weight="500" font-size="17" fill="#475569">CEO, Student</text>
    <text x="0" y="110" font-weight="500" font-size="17" fill="#475569">Organisation Vibranta</text>
  </g>

  <!-- Modern Origami / Ribbon Corners (Exact visual replica of the screenshot) -->
  <!-- BOTTOM LEFT RIBBON ACCENTS -->
  <!-- Background folded shadow piece -->
  <polygon points="0,910 180,950 180,1030 0,970" fill="url(#purpleRibbonDark)" />
  <!-- Under fold piece -->
  <polygon points="0,950 250,915 250,1070 0,1130" fill="url(#purpleRibbonDark)" opacity="0.9" />
  <!-- Main front vibrant folded ribbon shape 1 -->
  <polygon points="0,920 170,950 0,1090" fill="url(#purpleRibbon)" />
  <!-- Main front vibrant folded ribbon shape 2 -->
  <polygon points="0,1000 420,935 420,1130 0,1130" fill="url(#purpleRibbon)" />
  <polygon points="0,1000 370,935 370,1130 0,1130" fill="#752b82" />

  <!-- BOTTOM RIGHT RIBBON ACCENTS -->
  <!-- Background folded shadow piece -->
  <polygon points="1600,910 1420,950 1420,1030 1600,970" fill="url(#purpleRibbonDark)" />
  <!-- Under fold piece -->
  <polygon points="1600,950 1350,915 1350,1070 1600,1130" fill="url(#purpleRibbonDark)" opacity="0.9" />
  <!-- Main front vibrant folded ribbon shape 1 -->
  <polygon points="1600,920 1430,950 1600,1090" fill="url(#purpleRibbon)" />
  <!-- Main front vibrant folded ribbon shape 2 -->
  <polygon points="1600,1000 1180,935 1180,1130 1600,1130" fill="url(#purpleRibbon)" />
  <polygon points="1600,1000 1230,935 1230,1130 1600,1130" fill="#752b82" />
</svg>
