<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Completion Certificate - Infosys Springboard | Girish Kumar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f1115;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      margin-bottom: 20px;
      background: rgba(26, 29, 36, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }
    .cert-title h1 { font-size: 16px; font-weight: 700; color: #ffffff; }
    .cert-title p { font-size: 12px; color: #94a3b8; }
    .actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-blue { background: #0284c7; color: #ffffff; }
    .btn-blue:hover { background: #0369a1; }
    .btn-subtle { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .btn-subtle:hover { background: rgba(255,255,255,0.15); }
    .cert-wrapper {
      width: 100%;
      max-width: 1200px;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }
    .cert-svg {
      width: 100%;
      height: auto;
      display: block;
    }
    @media print {
      body { background: #ffffff; padding: 0; }
      .top-bar { display: none; }
      .cert-wrapper { box-shadow: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="cert-title">
      <h1>Infosys Springboard — Course Completion Certificate</h1>
      <p>Database Management System Part - 1 • Awarded to Girish Kumar (July 17, 2026)</p>
    </div>
    <div class="actions">
      <button onclick="window.print()" class="btn btn-blue">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        Print / Save PDF
      </button>
      <a href="/Infosys-Springboard-DBMS-Certificate.pdf" target="_blank" class="btn btn-subtle">
        Raw PDF
      </a>
      <a href="/" class="btn btn-subtle">Portfolio</a>
    </div>
  </div>

  <div class="cert-wrapper">
    <img src="/infosys-springboard-certificate.svg" alt="Infosys Springboard Certificate - Girish Kumar" class="cert-svg" />
  </div>
</body>
</html>
