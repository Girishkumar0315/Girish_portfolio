<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="100%" height="100%">
  <defs>
    <linearGradient id="analBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="60%" stop-color="#08142D"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>

    <!-- Area Chart Gradients -->
    <linearGradient id="pm25Area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pm10Area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#0070F3"/>
    </linearGradient>

    <pattern id="analGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00D2FF" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="900" fill="url(#analBg)"/>
  <rect width="1280" height="900" fill="url(#analGrid)"/>

  <!-- Top Header Title -->
  <g transform="translate(40, 30)">
    <rect width="1200" height="60" rx="16" fill="#0D1A38" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="36" cy="30" r="10" fill="#00D2FF"/>
    <text x="60" y="36" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="1">POLLUTANT TREND TIME-SERIES &amp; DAX STATISTICAL MODEL</text>
    <text x="960" y="36" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="13">● LIVE POWER BI SYNC</text>
  </g>

  <!-- KPI Cards Row (4 cards) -->
  <g transform="translate(40, 110)">
    <!-- KPI 1 -->
    <g transform="translate(0, 0)">
      <rect width="280" height="110" rx="16" fill="#0B1733" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#8EAECF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AVG PM2.5 NATIONWIDE</text>
      <text x="20" y="78" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="900">68.4 <tspan font-size="15" fill="#8EAECF">µg/m³</tspan></text>
      <text x="20" y="98" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▲ +12% winter peak surge</text>
    </g>

    <!-- KPI 2 -->
    <g transform="translate(305, 0)">
      <rect width="280" height="110" rx="16" fill="#0B1733" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#8EAECF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AVG PM10 DUST INDEX</text>
      <text x="20" y="78" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="900">138.6 <tspan font-size="15" fill="#8EAECF">µg/m³</tspan></text>
      <text x="20" y="98" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▲ Moderate seasonal variance</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(610, 0)">
      <rect width="280" height="110" rx="16" fill="#0B1733" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#8EAECF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SULPHUR DIOXIDE (SO2)</text>
      <text x="20" y="78" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="900">18.2 <tspan font-size="15" fill="#8EAECF">ppb</tspan></text>
      <text x="20" y="98" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▼ Within safe CPCB limits</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(915, 0)">
      <rect width="285" height="110" rx="16" fill="#0B1733" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#8EAECF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MONITORED STATIONS</text>
      <text x="20" y="78" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="900">4,812 <tspan font-size="15" fill="#8EAECF">IoT</tspan></text>
      <text x="20" y="98" fill="#00D2FF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">● 99.4% uptime telemetry</text>
    </g>
  </g>

  <!-- Big Graph: 12-Month Seasonal Pollution Wave -->
  <g transform="translate(40, 245)">
    <rect width="885" height="420" rx="20" fill="#0B1733" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.3"/>
    
    <!-- Graph Header -->
    <text x="30" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">12-MONTH HISTORICAL TREND ANALYSIS (PM2.5 vs PM10)</text>
    <circle cx="680" cy="36" r="6" fill="#EF4444"/>
    <text x="695" y="41" fill="#EF4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PM2.5</text>
    <circle cx="780" cy="36" r="6" fill="#00D2FF"/>
    <text x="795" y="41" fill="#00D2FF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PM10</text>

    <!-- Graph Axis Grid Lines -->
    <g stroke="#00D2FF" stroke-opacity="0.12" stroke-dasharray="4,4">
      <line x1="50" y1="90" x2="840" y2="90"/>
      <line x1="50" y1="160" x2="840" y2="160"/>
      <line x1="50" y1="230" x2="840" y2="230"/>
      <line x1="50" y1="300" x2="840" y2="300"/>
      <line x1="50" y1="370" x2="840" y2="370"/>
    </g>

    <!-- Y-Axis Labels -->
    <g fill="#6B88A8" font-family="system-ui, sans-serif" font-size="11">
      <text x="20" y="94">400</text>
      <text x="20" y="164">300</text>
      <text x="20" y="234">200</text>
      <text x="20" y="304">100</text>
      <text x="20" y="374">0</text>
    </g>

    <!-- Area & Line Charts: PM10 (Cyan) -->
    <path d="M 60,320 Q 140,300 200,280 T 340,240 T 480,340 T 600,310 T 720,180 T 830,120 L 830,370 L 60,370 Z"
          fill="url(#pm10Area)"/>
    <path d="M 60,320 Q 140,300 200,280 T 340,240 T 480,340 T 600,310 T 720,180 T 830,120"
          fill="none" stroke="#00D2FF" stroke-width="3.5" filter="drop-shadow(0 0 6px rgba(0,210,255,0.6))"/>

    <!-- Area & Line Charts: PM2.5 (Red) -->
    <path d="M 60,345 Q 140,335 200,315 T 340,290 T 480,360 T 600,345 T 720,230 T 830,155 L 830,370 L 60,370 Z"
          fill="url(#pm25Area)"/>
    <path d="M 60,345 Q 140,335 200,315 T 340,290 T 480,360 T 600,345 T 720,230 T 830,155"
          fill="none" stroke="#EF4444" stroke-width="3" filter="drop-shadow(0 0 6px rgba(239,68,68,0.6))"/>

    <!-- Months X-Axis -->
    <g fill="#8EAECF" font-family="system-ui, sans-serif" font-size="11">
      <text x="55" y="396">Jan</text>
      <text x="125" y="396">Feb</text>
      <text x="195" y="396">Mar</text>
      <text x="265" y="396">Apr</text>
      <text x="335" y="396">May</text>
      <text x="405" y="396">Jun</text>
      <text x="475" y="396">Jul (Rain)</text>
      <text x="545" y="396">Aug</text>
      <text x="615" y="396">Sep</text>
      <text x="685" y="396">Oct</text>
      <text x="755" y="396">Nov (Peak)</text>
      <text x="820" y="396">Dec</text>
    </g>
  </g>

  <!-- Donut & Rankings Side Column -->
  <g transform="translate(945, 245)">
    <!-- Donut Chart: AQI Categories -->
    <rect width="295" height="420" rx="20" fill="#0B1733" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.3"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">AIR QUALITY CATEGORIES</text>

    <!-- Donut Rings -->
    <g transform="translate(148, 140)">
      <!-- Background Circle -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#102344" stroke-width="26"/>
      <!-- Segments -->
      <!-- Good (Green) 25% -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#10B981" stroke-width="26" stroke-dasharray="110 440" stroke-dashoffset="0"/>
      <!-- Moderate (Yellow) 35% -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#F59E0B" stroke-width="26" stroke-dasharray="150 440" stroke-dashoffset="-115"/>
      <!-- Poor (Orange) 25% -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#F97316" stroke-width="26" stroke-dasharray="110 440" stroke-dashoffset="-270"/>
      <!-- Severe (Red) 15% -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#EF4444" stroke-width="26" stroke-dasharray="65 440" stroke-dashoffset="-385"/>

      <!-- Center Text -->
      <text x="0" y="2" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">728</text>
      <text x="0" y="18" fill="#8EAECF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Districts</text>
    </g>

    <!-- Legend & DAX Indicators -->
    <g transform="translate(24, 250)" font-family="system-ui, sans-serif" font-size="12">
      <circle cx="8" cy="8" r="6" fill="#10B981"/>
      <text x="24" y="12" fill="#FFFFFF">Good (0–50 AQI)</text>
      <text x="220" y="12" fill="#8EAECF">25%</text>

      <circle cx="8" cy="38" r="6" fill="#F59E0B"/>
      <text x="24" y="42" fill="#FFFFFF">Moderate (51–100)</text>
      <text x="220" y="42" fill="#8EAECF">35%</text>

      <circle cx="8" cy="68" r="6" fill="#F97316"/>
      <text x="24" y="72" fill="#FFFFFF">Poor (101–200)</text>
      <text x="220" y="72" fill="#8EAECF">25%</text>

      <circle cx="8" cy="98" r="6" fill="#EF4444"/>
      <text x="24" y="102" fill="#FFFFFF">Severe (&gt;200)</text>
      <text x="220" y="102" fill="#8EAECF">15%</text>
    </g>

    <text x="24" y="390" fill="#00D2FF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚡ Dynamic DAX Cross-Filtering Enabled</text>
  </g>

  <!-- Bottom Bar: DAX Calculated Columns -->
  <g transform="translate(40, 685)">
    <rect width="1200" height="185" rx="20" fill="#0B1733" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.3"/>
    <text x="30" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">DAX COMPUTATIONAL PIPELINE &amp; POLICY IMPACT PROJECTION</text>
    
    <g transform="translate(30, 65)">
      <rect width="360" height="95" rx="12" fill="#060F22" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.2"/>
      <text x="18" y="30" fill="#00D2FF" font-family="monospace" font-size="12" font-weight="700">AQI_Severity_Weight = </text>
      <text x="18" y="52" fill="#8EAECF" font-family="monospace" font-size="11">CALCULATE(SUM(Pollutants[PM2.5]) * 0.45</text>
      <text x="18" y="72" fill="#8EAECF" font-family="monospace" font-size="11">+ SUM(Pollutants[PM10]) * 0.35, ...)</text>
    </g>

    <g transform="translate(420, 65)">
      <rect width="360" height="95" rx="12" fill="#060F22" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.2"/>
      <text x="18" y="30" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">CleanAir_Action_Score = </text>
      <text x="18" y="52" fill="#8EAECF" font-family="monospace" font-size="11">VAR Baseline = AVERAGE(AQI[Annual])</text>
      <text x="18" y="72" fill="#8EAECF" font-family="monospace" font-size="11">RETURN DIVIDE(Baseline - Current, Baseline)</text>
    </g>

    <g transform="translate(810, 65)">
      <rect width="360" height="95" rx="12" fill="#060F22" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.2"/>
      <text x="18" y="30" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="700">State_Severity_Rank = </text>
      <text x="18" y="52" fill="#8EAECF" font-family="monospace" font-size="11">RANKX(ALL(Geography[State]),</text>
      <text x="18" y="72" fill="#8EAECF" font-family="monospace" font-size="11">[Weighted_AQI_Score],, DESC, Dense)</text>
    </g>
  </g>
</svg>
