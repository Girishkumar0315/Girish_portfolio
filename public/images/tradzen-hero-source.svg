<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#07221A"/>
      <stop offset="50%" stop-color="#070D12"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>

    <!-- Heading Gradient "With AI Guidance" -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="35%" stop-color="#00D2FF"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Button Glow -->
    <radialGradient id="btnGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- TOP NAVBAR -->
  <g transform="translate(0, 0)">
    <!-- Brand Logo -->
    <g transform="translate(60, 36)">
      <!-- Lightning bolt icon in turquoise circle -->
      <circle cx="20" cy="20" r="20" fill="#00F5A0"/>
      <!-- Lightning bolt path -->
      <path d="M 21,9 L 12,22 L 19,22 L 17,31 L 28,18 L 21,18 Z" fill="#050709"/>
      <!-- Brand Name -->
      <text x="52" y="27" fill="#00F5A0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5">TradeZen</text>
    </g>

    <!-- Center Navigation Links -->
    <g transform="translate(560, 56)" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
      <text x="0" y="0">Features</text>
      <text x="100" y="0">AI Mentor</text>
      <text x="210" y="0">Comparison</text>
      <text x="340" y="0">FAQ</text>
    </g>

    <!-- Right Controls -->
    <g transform="translate(1300, 36)">
      <text x="0" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Log In</text>
      <!-- Get Started Button -->
      <g transform="translate(80, 0)">
        <rect width="154" height="42" rx="21" fill="#00F5A0"/>
        <text x="77" y="26" fill="#050709" font-family="system-ui, sans-serif" font-weight="700" font-size="15" text-anchor="middle">Get Started →</text>
      </g>
    </g>
  </g>

  <!-- CENTER PILL BADGE -->
  <g transform="translate(800, 150)" text-anchor="middle">
    <!-- Pill container -->
    <rect x="-280" y="0" width="560" height="38" rx="19" fill="#071914" stroke="#0D543A" stroke-width="1.2"/>
    <!-- Sparkle Icon -->
    <g transform="translate(-245, 11)">
      <path d="M 8,0 L 10,6 L 16,8 L 10,10 L 8,16 L 6,10 L 0,8 L 6,6 Z" fill="#00F5A0"/>
    </g>
    <text x="10" y="24" fill="#00F5A0" font-family="system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="0.3">
      AI-Powered Trading Intelligence — 100% Free &amp; Open Source
    </text>
  </g>

  <!-- MAIN HERO HEADLINE -->
  <g transform="translate(800, 275)" text-anchor="middle">
    <!-- Line 1: Master Crypto Trading -->
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" letter-spacing="-1.5">
      Master Crypto Trading
    </text>
    <!-- Line 2: With AI Guidance -->
    <text x="0" y="95" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" letter-spacing="-1.5" filter="drop-shadow(0 0 25px rgba(0,245,160,0.25))">
      With AI Guidance
    </text>
  </g>

  <!-- SUBTITLE PARAGRAPH -->
  <g transform="translate(800, 435)" text-anchor="middle">
    <text x="0" y="0" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="21" letter-spacing="0.1">
      50 live crypto pairs, 4 AI mentor personas, pro chart indicators,
    </text>
    <text x="0" y="32" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="21" letter-spacing="0.1">
      portfolio analytics, and smart alerts — everything a serious trader
    </text>
    <text x="0" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="21" letter-spacing="0.1">
      needs, in one platform.
    </text>
  </g>

  <!-- CTA BUTTONS -->
  <g transform="translate(800, 565)">
    <!-- Button 1: Start Trading Smarter -->
    <g transform="translate(-250, 0)">
      <!-- Glow -->
      <rect x="-10" y="-8" width="246" height="68" rx="34" fill="url(#btnGlow)"/>
      <!-- Button -->
      <rect width="226" height="52" rx="26" fill="#081612" stroke="#00F5A0" stroke-width="1.2"/>
      <text x="113" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">
        Start Trading Smarter →
      </text>
    </g>

    <!-- Button 2: View Live Demo -->
    <g transform="translate(30, 0)">
      <rect width="186" height="52" rx="26" fill="#0C1017" stroke="#334155" stroke-width="1.2"/>
      <!-- Play icon -->
      <path d="M 36,20 L 46,26 L 36,32 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      <text x="108" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="16" text-anchor="middle">
        View Live Demo
      </text>
    </g>
  </g>

  <!-- TRUST LABELS ROW -->
  <g transform="translate(800, 665)" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
    <!-- Lock: Supabase Secured -->
    <g transform="translate(-210, 0)">
      <path d="M -68,-4 L -68,-8 C -68,-11 -66,-13 -63,-13 C -60,-13 -58,-11 -58,-8 L -58,-4 M -70,-4 L -56,-4 L -56,4 L -70,4 Z" fill="none" stroke="#64748B" stroke-width="1.3"/>
      <text x="0" y="0">Supabase Secured</text>
    </g>

    <!-- Signal: Real-time WebSocket -->
    <g transform="translate(0, 0)">
      <path d="M -80,2 C -78,-3 -72,-3 -70,2 M -83,5 C -79,-7 -71,-7 -67,5" fill="none" stroke="#64748B" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="-75" cy="4" r="1.5" fill="#64748B"/>
      <text x="0" y="0">Real-time WebSocket</text>
    </g>

    <!-- Code: Open Source -->
    <g transform="translate(200, 0)">
      <text x="-65" y="0" font-family="monospace" font-weight="700">&lt;/&gt;</text>
      <text x="0" y="0">Open Source</text>
    </g>
  </g>

  <!-- 4 STATS ROW -->
  <g transform="translate(800, 780)">
    <!-- Stat 1: 50+ Live Coins -->
    <g transform="translate(-360, 0)" text-anchor="middle">
      <text x="0" y="0" fill="#00F5A0" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">50+</text>
      <text x="0" y="28" fill="#64748B" font-family="system-ui, sans-serif" font-weight="500" font-size="14">Live Coins</text>
    </g>

    <!-- Stat 2: 4 AI Personas -->
    <g transform="translate(-120, 0)" text-anchor="middle">
      <text x="0" y="0" fill="#00F5A0" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">4</text>
      <text x="0" y="28" fill="#64748B" font-family="system-ui, sans-serif" font-weight="500" font-size="14">AI Personas</text>
    </g>

    <!-- Stat 3: 5+ Chart Indicators -->
    <g transform="translate(120, 0)" text-anchor="middle">
      <text x="0" y="0" fill="#00F5A0" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">5+</text>
      <text x="0" y="28" fill="#64748B" font-family="system-ui, sans-serif" font-weight="500" font-size="14">Chart Indicators</text>
    </g>

    <!-- Stat 4: 100% Free Forever -->
    <g transform="translate(360, 0)" text-anchor="middle">
      <text x="0" y="0" fill="#00F5A0" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">100%</text>
      <text x="0" y="28" fill="#64748B" font-family="system-ui, sans-serif" font-weight="500" font-size="14">Free Forever</text>
    </g>
  </g>
</svg>
