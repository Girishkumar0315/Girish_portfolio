<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#081427"/>
      <stop offset="100%" stop-color="#030710"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Copper Gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB38A"/>
      <stop offset="40%" stop-color="#E07A5F"/>
      <stop offset="80%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#8C3A1E"/>
    </linearGradient>

    <!-- Oil Barrel Gradient -->
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="35%" stop-color="#27272A"/>
      <stop offset="70%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>

    <!-- Chart Grid Pattern -->
    <pattern id="chartGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00E5FF" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>

    <!-- Glowing Chart Gradient -->
    <linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="800" fill="url(#commBg)"/>
  <rect width="1280" height="800" fill="url(#chartGrid)"/>

  <!-- Top Banner -->
  <g transform="translate(30, 24)">
    <rect width="1220" height="52" rx="14" fill="#0C1B33" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.3"/>
    <circle cx="28" cy="26" r="6" fill="#F59E0B"/>
    <text x="44" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="16" letter-spacing="1">GLOBAL &amp; DOMESTIC COMMODITY INDEX BASKET</text>
    <text x="1000" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="12">MCX &amp; NCDEX MULTI-COMMODITY</text>
  </g>

  <!-- CENTER FINANCIAL MARKET CHART GRAPH -->
  <g transform="translate(280, 110)">
    <!-- Chart Screen Backing -->
    <rect width="720" height="460" rx="20" fill="#061226" fill-opacity="0.75" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.35"/>
    
    <!-- Coordinate lines -->
    <g stroke="#00D2FF" stroke-opacity="0.15" stroke-dasharray="3,3">
      <line x1="40" y1="80" x2="680" y2="80"/>
      <line x1="40" y1="160" x2="680" y2="160"/>
      <line x1="40" y1="240" x2="680" y2="240"/>
      <line x1="40" y1="320" x2="680" y2="320"/>
      <line x1="40" y1="400" x2="680" y2="400"/>
    </g>

    <!-- Candlestick Volume Bars Background -->
    <g transform="translate(50, 40)">
      <!-- Green Bullish Bars -->
      <rect x="30" y="240" width="12" height="110" fill="#10B981" fill-opacity="0.5"/>
      <rect x="70" y="210" width="12" height="140" fill="#10B981" fill-opacity="0.5"/>
      <rect x="110" y="260" width="12" height="90" fill="#EF4444" fill-opacity="0.5"/>
      <rect x="150" y="190" width="12" height="160" fill="#10B981" fill-opacity="0.6"/>
      <rect x="190" y="150" width="12" height="200" fill="#10B981" fill-opacity="0.6"/>
      <rect x="230" y="180" width="12" height="170" fill="#EF4444" fill-opacity="0.5"/>
      <rect x="270" y="130" width="12" height="220" fill="#10B981" fill-opacity="0.7"/>
      <rect x="310" y="110" width="12" height="240" fill="#10B981" fill-opacity="0.7"/>
      <rect x="350" y="140" width="12" height="210" fill="#EF4444" fill-opacity="0.5"/>
      <rect x="390" y="90" width="12" height="260" fill="#10B981" fill-opacity="0.7"/>
      <rect x="430" y="120" width="12" height="230" fill="#EF4444" fill-opacity="0.5"/>
      <rect x="470" y="70" width="12" height="280" fill="#10B981" fill-opacity="0.8"/>
      <rect x="510" y="60" width="12" height="290" fill="#10B981" fill-opacity="0.85"/>
      <rect x="550" y="90" width="12" height="260" fill="#EF4444" fill-opacity="0.5"/>
      <rect x="590" y="40" width="12" height="310" fill="#10B981" fill-opacity="0.9"/>
    </g>

    <!-- Dynamic Trend Wave Path -->
    <path d="M 60,320 Q 180,340 260,240 T 420,180 T 560,110 T 670,60 L 670,420 L 60,420 Z" fill="url(#chartArea)"/>
    <path d="M 60,320 Q 180,340 260,240 T 420,180 T 560,110 T 670,60" fill="none" stroke="#22D3EE" stroke-width="4" filter="drop-shadow(0 0 10px #22D3EE)"/>
    <circle cx="670" cy="60" r="7" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>

    <!-- Index Marker text -->
    <text x="60" y="42" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="700" font-size="14">AGRI-COMMODITY MODAL PRICE TRENDLINE</text>
    <text x="560" y="42" fill="#34D399" font-family="system-ui, sans-serif" font-weight="800" font-size="14">▲ +24.8% YTD</text>
  </g>

  <!-- TOP-LEFT: COPPER TUBES & COAL -->
  <g transform="translate(30, 90)">
    <!-- Copper tubes bundle -->
    <g transform="rotate(25)">
      <rect x="30" y="0" width="220" height="22" rx="6" fill="url(#copperGrad)" filter="drop-shadow(2px 4px 8px rgba(0,0,0,0.6))"/>
      <ellipse cx="32" cy="11" rx="4" ry="11" fill="#FFC9A8"/>
      <rect x="20" y="24" width="230" height="22" rx="6" fill="url(#copperGrad)" filter="drop-shadow(2px 4px 8px rgba(0,0,0,0.6))"/>
      <ellipse cx="22" cy="35" rx="4" ry="11" fill="#FFC9A8"/>
      <rect x="40" y="48" width="210" height="22" rx="6" fill="url(#copperGrad)" filter="drop-shadow(2px 4px 8px rgba(0,0,0,0.6))"/>
      <ellipse cx="42" cy="59" rx="4" ry="11" fill="#FFC9A8"/>
    </g>
    <!-- Black Coal Rocks -->
    <g transform="translate(140, 10)">
      <polygon points="40,20 80,10 110,35 90,75 50,80 25,50" fill="#1C1E24" stroke="#2D3139" stroke-width="2"/>
      <polygon points="85,30 130,20 150,55 125,90 85,75" fill="#111317" stroke="#2D3139" stroke-width="2"/>
    </g>
  </g>

  <!-- TOP-RIGHT: SILVER INGOTS & SOYBEAN PODS -->
  <g transform="translate(970, 70)">
    <!-- Silver Ingot 1 -->
    <polygon points="50,40 180,20 220,55 80,75" fill="url(#silverGrad)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.6))"/>
    <text x="120" y="52" fill="#475569" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="1">FINE SILVER</text>
    <!-- Silver Ingot 2 -->
    <polygon points="80,70 210,50 250,85 110,105" fill="url(#silverGrad)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.6))"/>

    <!-- Green Soybean / Edamame Pods -->
    <g transform="translate(120, 110) rotate(-15)">
      <!-- Pod 1 -->
      <path d="M 0,20 C 30,0 70,0 110,20 C 120,25 110,35 90,38 C 50,44 20,40 0,20 Z" fill="#65A30D" stroke="#4D7C0F" stroke-width="2"/>
      <!-- Peas bumps -->
      <circle cx="30" cy="18" r="9" fill="#84CC16"/>
      <circle cx="60" cy="19" r="10" fill="#84CC16"/>
      <circle cx="90" cy="22" r="9" fill="#84CC16"/>
    </g>
  </g>

  <!-- MID-LEFT: 999.9 GOLD BARS, RICE & WHEAT STALKS -->
  <g transform="translate(30, 360)">
    <!-- Gold Ingot 1 -->
    <polygon points="20,60 170,25 210,75 50,115" fill="url(#goldGrad)" filter="drop-shadow(0 8px 16px rgba(245,158,11,0.35))"/>
    <polygon points="170,25 205,35 245,85 210,75" fill="#B45309"/>
    <text x="100" y="70" fill="#78350F" font-family="system-ui, sans-serif" font-weight="900" font-size="14" transform="rotate(-13 100 70)">FINE GOLD 999.9</text>

    <!-- Gold Ingot 2 under -->
    <polygon points="0,110 150,75 190,125 30,165" fill="url(#goldGrad)" opacity="0.9"/>

    <!-- Raw Rice Grains Mound -->
    <g transform="translate(20, 180)">
      <ellipse cx="70" cy="70" rx="65" ry="40" fill="#E2E8F0" opacity="0.9"/>
      <ellipse cx="60" cy="65" rx="5" ry="12" fill="#FFFFFF" transform="rotate(25 60 65)"/>
      <ellipse cx="75" cy="60" rx="5" ry="12" fill="#FFFFFF" transform="rotate(-35 75 60)"/>
      <ellipse cx="90" cy="70" rx="5" ry="12" fill="#FFFFFF" transform="rotate(10 90 70)"/>
      <ellipse cx="45" cy="72" rx="5" ry="12" fill="#FFFFFF" transform="rotate(45 45 72)"/>
    </g>

    <!-- Golden Wheat Sheaf -->
    <g transform="translate(150, 180)">
      <path d="M 0,80 Q 20,40 50,0" stroke="#F59E0B" stroke-width="3" fill="none"/>
      <!-- Wheat grains -->
      <ellipse cx="10" cy="60" rx="6" ry="14" fill="#FBBF24" transform="rotate(-30 10 60)"/>
      <ellipse cx="25" cy="45" rx="6" ry="14" fill="#FBBF24" transform="rotate(30 25 45)"/>
      <ellipse cx="32" cy="25" rx="6" ry="14" fill="#FBBF24" transform="rotate(-25 32 25)"/>
      <ellipse cx="45" cy="10" rx="6" ry="14" fill="#FBBF24" transform="rotate(25 45 10)"/>
    </g>
  </g>

  <!-- MID-RIGHT: INDUSTRIAL OIL BARREL & STEEL PIPES -->
  <g transform="translate(1010, 290)">
    <!-- Black Steel Oil Barrel -->
    <g transform="translate(70, 0)">
      <!-- Barrel body -->
      <rect x="0" y="25" width="160" height="230" rx="18" fill="url(#oilGrad)" stroke="#3F3F46" stroke-width="2" filter="drop-shadow(0 10px 24px rgba(0,0,0,0.8))"/>
      <!-- Barrel ribs -->
      <line x1="0" y1="85" x2="160" y2="85" stroke="#52525B" stroke-width="4"/>
      <line x1="0" y1="165" x2="160" y2="165" stroke="#52525B" stroke-width="4"/>
      <!-- Barrel Top Rim -->
      <ellipse cx="80" cy="25" rx="80" ry="20" fill="#27272A" stroke="#52525B" stroke-width="2"/>
      <circle cx="50" cy="25" r="10" fill="#18181B" stroke="#71717A" stroke-width="1.5"/>

      <!-- "OIL" Stamp Badge -->
      <ellipse cx="80" cy="125" rx="42" ry="30" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <text x="80" y="134" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" text-anchor="middle" letter-spacing="1">OIL</text>
    </g>

    <!-- Bundle of Steel Metal Tubes -->
    <g transform="translate(0, 160)">
      <rect x="0" y="20" width="150" height="18" rx="5" fill="url(#silverGrad)"/>
      <ellipse cx="5" cy="29" rx="5" ry="9" fill="#CBD5E1"/>
      <rect x="15" y="42" width="145" height="18" rx="5" fill="url(#silverGrad)"/>
      <ellipse cx="20" cy="51" rx="5" ry="9" fill="#CBD5E1"/>
      <rect x="5" y="64" width="150" height="18" rx="5" fill="url(#silverGrad)"/>
      <ellipse cx="10" cy="73" rx="5" ry="9" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- BOTTOM ROW: SWEET CORN, COFFEE BEANS, SUGAR CUBES -->
  <g transform="translate(360, 600)">
    <!-- Sugar Cubes -->
    <g transform="translate(30, 60)">
      <!-- Cube 1 -->
      <polygon points="20,20 50,8 75,22 45,36" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <polygon points="20,20 45,36 45,70 20,54" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
      <polygon points="45,36 75,22 75,56 45,70" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
      <!-- Cube 2 -->
      <polygon points="65,40 95,28 120,42 90,56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <polygon points="65,40 90,56 90,90 65,74" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <polygon points="90,56 120,42 120,76 90,90" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    </g>

    <!-- Roasted Coffee Beans -->
    <g transform="translate(180, 70)">
      <!-- Bean 1 -->
      <ellipse cx="30" cy="40" rx="18" ry="13" fill="#451A03" stroke="#290E02" stroke-width="1.5" transform="rotate(25 30 40)"/>
      <path d="M 18,34 Q 30,40 42,46" stroke="#290E02" stroke-width="2" fill="none"/>
      <!-- Bean 2 -->
      <ellipse cx="65" cy="52" rx="19" ry="14" fill="#5E2207" stroke="#371404" stroke-width="1.5" transform="rotate(-35 65 52)"/>
      <path d="M 52,60 Q 65,52 78,44" stroke="#290E02" stroke-width="2" fill="none"/>
      <!-- Bean 3 -->
      <ellipse cx="45" cy="80" rx="17" ry="12" fill="#451A03" stroke="#290E02" stroke-width="1.5" transform="rotate(75 45 80)"/>
      <path d="M 44,66 Q 45,80 46,94" stroke="#290E02" stroke-width="2" fill="none"/>
    </g>

    <!-- Sweet Corn on the Cob with Husk -->
    <g transform="translate(280, 20)">
      <!-- Green husk leaves -->
      <path d="M 40,110 C 20,70 10,40 30,10 C 45,40 50,70 40,110 Z" fill="#84CC16" stroke="#65A30D" stroke-width="2"/>
      <path d="M 110,120 C 130,80 140,50 120,20 C 105,50 100,80 110,120 Z" fill="#84CC16" stroke="#65A30D" stroke-width="2"/>
      <!-- Yellow Corn ear -->
      <path d="M 45,120 C 40,80 50,25 75,10 C 100,25 110,80 105,120 Z" fill="#EAB308" stroke="#CA8A04" stroke-width="2"/>
      <!-- Corn kernels pattern -->
      <g fill="#FDE047" stroke="#CA8A04" stroke-width="0.75">
        <circle cx="65" cy="35" r="4"/><circle cx="75" cy="34" r="4"/><circle cx="85" cy="35" r="4"/>
        <circle cx="60" cy="48" r="4.5"/><circle cx="72" cy="48" r="4.5"/><circle cx="84" cy="48" r="4.5"/><circle cx="95" cy="48" r="4.5"/>
        <circle cx="58" cy="62" r="5"/><circle cx="72" cy="62" r="5"/><circle cx="86" cy="62" r="5"/><circle cx="98" cy="62" r="5"/>
        <circle cx="58" cy="78" r="5"/><circle cx="72" cy="78" r="5"/><circle cx="86" cy="78" r="5"/><circle cx="98" cy="78" r="5"/>
        <circle cx="60" cy="94" r="5"/><circle cx="74" cy="94" r="5"/><circle cx="88" cy="94" r="5"/>
      </g>
    </g>

    <!-- Category Label Pill -->
    <rect x="420" y="80" width="220" height="42" rx="10" fill="#0E1D38" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="530" y="106" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">AGRI &amp; SOFT COMMODITIES</text>
  </g>
</svg>
