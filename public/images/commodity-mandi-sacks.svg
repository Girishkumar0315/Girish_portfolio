<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="marketBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="50%" stop-color="#0E1218"/>
      <stop offset="100%" stop-color="#06090D"/>
    </linearGradient>

    <!-- Yellow Sack Fabric Pattern -->
    <pattern id="yellowWeave" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#EAB308"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#CA8A04" stroke-width="1.5"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#CA8A04" stroke-width="1.5"/>
    </pattern>

    <!-- Jute Burlap Pattern -->
    <pattern id="juteWeave" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#A27B5C"/>
      <path d="M 0,0 L 16,16 M 16,0 L 0,16" stroke="#855835" stroke-width="1.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Teal Sack Pattern -->
    <pattern id="tealWeave" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0D9488"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#0F766E" stroke-width="1.5"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#0F766E" stroke-width="1.5"/>
    </pattern>

    <!-- Peanuts Gradient -->
    <radialGradient id="peanutsGrad" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#C26D4D"/>
      <stop offset="60%" stop-color="#9A4325"/>
      <stop offset="100%" stop-color="#6E2812"/>
    </radialGradient>

    <!-- Yellow Dal Gradient -->
    <radialGradient id="yellowDalGrad" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </radialGradient>

    <!-- Black Urad Gradient -->
    <radialGradient id="blackUradGrad" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="60%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>

    <!-- Tin Measure Gradient -->
    <linearGradient id="tinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1280" height="840" fill="url(#marketBg)"/>

  <!-- Top Ambient Banner -->
  <g transform="translate(40, 24)">
    <rect width="1200" height="52" rx="14" fill="#131924" fill-opacity="0.9" stroke="#EAB308" stroke-width="1.2" stroke-opacity="0.3"/>
    <circle cx="28" cy="26" r="6" fill="#10B981"/>
    <text x="44" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="16" letter-spacing="1">INDIAN APMC WHOLESALE MANDI GRAIN MARKET</text>
    <text x="960" y="32" fill="#FBBF24" font-family="system-ui, sans-serif" font-weight="700" font-size="12">205 AGRI COMMODITIES MONITORED</text>
  </g>

  <!-- TIER 3 (BACKGROUND SACKS & WAREHOUSE) -->
  <g transform="translate(60, 90)">
    <!-- Top Left Brown Jute Sack -->
    <g transform="translate(60, 20)">
      <path d="M 20,60 Q 150,20 280,60 L 290,200 Q 150,230 10,200 Z" fill="url(#juteWeave)" opacity="0.8"/>
      <!-- Sack Rim -->
      <ellipse cx="150" cy="60" rx="130" ry="25" fill="#855835"/>
      <!-- Rajma / Red Kidney Beans Mound -->
      <ellipse cx="150" cy="55" rx="120" ry="20" fill="#7F1D1D"/>
      <circle cx="120" cy="50" r="3" fill="#991B1B"/><circle cx="150" cy="52" r="3" fill="#991B1B"/><circle cx="180" cy="48" r="3" fill="#991B1B"/>
    </g>

    <!-- Top Center Stenciled Sack (EMO S...) -->
    <g transform="translate(420, 10)">
      <path d="M 30,70 Q 180,30 330,70 L 340,240 Q 180,270 20,240 Z" fill="url(#juteWeave)"/>
      <ellipse cx="180" cy="70" rx="150" ry="28" fill="#855835"/>
      <!-- Grain Mound -->
      <ellipse cx="180" cy="65" rx="140" ry="22" fill="#B45309"/>
      <!-- Stencil Lettering "EMO S..." -->
      <text x="180" y="150" fill="#701A1E" font-family="monospace, serif" font-weight="900" font-size="28" text-anchor="middle" transform="rotate(5 180 150)" letter-spacing="4">EMO SPICES</text>
      <text x="180" y="190" fill="#701A1E" font-family="monospace, serif" font-weight="900" font-size="24" text-anchor="middle" transform="rotate(5 180 190)" letter-spacing="6">APMC MANDI</text>
      <!-- Tin Measuring Cylinder inserted into sack -->
      <rect x="250" y="20" width="44" height="75" rx="4" fill="url(#tinGrad)" stroke="#475569" stroke-width="1.5" transform="rotate(-15 250 20)"/>
    </g>

    <!-- Top Right Jute Sack (HUL...) -->
    <g transform="translate(820, 30)">
      <path d="M 20,60 Q 140,25 260,60 L 270,220 Q 140,250 10,220 Z" fill="url(#juteWeave)" opacity="0.85"/>
      <ellipse cx="140" cy="60" rx="120" ry="24" fill="#855835"/>
      <!-- Chickpeas Mound -->
      <ellipse cx="140" cy="55" rx="110" ry="20" fill="#D97706"/>
      <text x="140" y="140" fill="#581C87" font-family="monospace, serif" font-weight="900" font-size="28" text-anchor="middle" transform="rotate(-8 140 140)" letter-spacing="4">HUL GRAINS</text>
    </g>
  </g>

  <!-- TIER 2 (MID-GROUND SACKS) -->
  <g transform="translate(30, 240)">
    <!-- Teal Polypropylene Sack (Black Lentils / Urad Dal) -->
    <g transform="translate(40, 20)">
      <path d="M 15,80 Q 170,30 320,80 L 330,280 Q 170,310 5,280 Z" fill="url(#tealWeave)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.7))"/>
      <!-- Rolled Fabric Rim -->
      <path d="M 15,80 Q 170,40 320,80 Q 170,120 15,80 Z" fill="#14B8A6" stroke="#0F766E" stroke-width="2"/>
      <!-- Black Grains Mound -->
      <ellipse cx="170" cy="80" rx="135" ry="30" fill="url(#blackUradGrad)"/>
      <ellipse cx="170" cy="65" rx="90" ry="20" fill="#111827"/>
      <!-- Individual bean dots -->
      <g fill="#4B5563">
        <circle cx="120" cy="75" r="2.5"/><circle cx="140" cy="78" r="2.5"/><circle cx="160" cy="70" r="2.5"/>
        <circle cx="180" cy="74" r="2.5"/><circle cx="200" cy="78" r="2.5"/><circle cx="220" cy="72" r="2.5"/>
      </g>
      <!-- Tin Scoop inserted -->
      <rect x="250" y="30" width="38" height="65" rx="4" fill="url(#tinGrad)" stroke="#334155" stroke-width="1.5" transform="rotate(18 250 30)"/>
    </g>

    <!-- Center Jute Sack (Pinto / Speckled Beans) -->
    <g transform="translate(430, 10)">
      <path d="M 20,85 Q 190,30 360,85 L 370,300 Q 190,330 10,300 Z" fill="url(#juteWeave)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.7))"/>
      <!-- Rolled Burlap Rim -->
      <path d="M 20,85 Q 190,45 360,85 Q 190,130 20,85 Z" fill="#D7B18E" stroke="#855835" stroke-width="2.5"/>
      <!-- Yellow Pulses Mound -->
      <ellipse cx="190" cy="85" rx="155" ry="32" fill="url(#yellowDalGrad)"/>
      <ellipse cx="190" cy="65" rx="100" ry="22" fill="#FEF08A"/>
    </g>

    <!-- Right Sack (White Beans / Kabuli Chana) -->
    <g transform="translate(860, 25)">
      <path d="M 20,80 Q 160,35 300,80 L 310,280 Q 160,310 10,280 Z" fill="url(#juteWeave)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.7))"/>
      <path d="M 20,80 Q 160,45 300,80 Q 160,120 20,80 Z" fill="#E2C9A6" stroke="#855835" stroke-width="2"/>
      <ellipse cx="160" cy="80" rx="130" ry="28" fill="#F1F5F9"/>
      <g fill="#CBD5E1">
        <circle cx="120" cy="78" r="4"/><circle cx="145" cy="74" r="4"/><circle cx="170" cy="80" r="4"/>
        <circle cx="195" cy="76" r="4"/><circle cx="215" cy="82" r="4"/>
      </g>
    </g>
  </g>

  <!-- TIER 1 (FOREGROUND MAJOR SACKS) -->
  <g transform="translate(20, 440)">
    <!-- Big Yellow Woven Sack (Left) - Filled with Chana Dal / Chickpeas -->
    <g transform="translate(20, 0)">
      <!-- Main Sack Body -->
      <path d="M 10,100 Q 190,40 370,100 L 380,380 Q 190,410 0,380 Z" fill="url(#yellowWeave)" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.85))"/>
      <!-- Deep Folded Rim -->
      <path d="M 10,100 Q 190,50 370,100 Q 190,150 10,100 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="3"/>
      <!-- Overflowing Chickpeas / Chana Dal Mound -->
      <ellipse cx="190" cy="100" rx="165" ry="42" fill="url(#yellowDalGrad)"/>
      <ellipse cx="190" cy="70" rx="110" ry="30" fill="#FEF08A"/>
      <!-- Surface Seed Texture -->
      <g fill="#CA8A04">
        <circle cx="130" cy="90" r="3.5"/><circle cx="160" cy="95" r="3.5"/><circle cx="190" cy="85" r="3.5"/>
        <circle cx="220" cy="92" r="3.5"/><circle cx="250" cy="88" r="3.5"/><circle cx="150" cy="72" r="3.5"/>
        <circle cx="180" cy="68" r="3.5"/><circle cx="210" cy="70" r="3.5"/><circle cx="230" cy="74" r="3.5"/>
      </g>
      <!-- Label tag on sack -->
      <rect x="80" y="240" width="160" height="40" rx="6" fill="#0A1628" stroke="#EAB308" stroke-width="1.5"/>
      <text x="160" y="265" fill="#FEF08A" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle">CHANA DAL (PULSE)</text>
    </g>

    <!-- Center Big Burlap Sack - Filled with Peanuts / Groundnuts in skins -->
    <g transform="translate(440, 40)">
      <!-- Main Sack Body -->
      <path d="M 15,100 Q 190,40 370,100 L 380,340 Q 190,370 0,340 Z" fill="url(#juteWeave)" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.85))"/>
      <!-- Thick Rolled Burlap Rim -->
      <path d="M 15,100 Q 190,50 370,100 Q 190,150 15,100 Z" fill="#E2BC92" stroke="#855835" stroke-width="3"/>
      <!-- Heap of Peanuts / Groundnuts -->
      <ellipse cx="190" cy="100" rx="165" ry="42" fill="url(#peanutsGrad)"/>
      <ellipse cx="190" cy="70" rx="120" ry="32" fill="#C26D4D"/>
      <!-- Peanut Shapes -->
      <g fill="#9A4325">
        <ellipse cx="140" cy="90" rx="7" ry="14" transform="rotate(25 140 90)"/>
        <ellipse cx="170" cy="95" rx="7" ry="14" transform="rotate(-30 170 95)"/>
        <ellipse cx="200" cy="85" rx="7" ry="14" transform="rotate(15 200 85)"/>
        <ellipse cx="230" cy="92" rx="7" ry="14" transform="rotate(-15 230 92)"/>
        <ellipse cx="160" cy="72" rx="7" ry="14" transform="rotate(45 160 72)"/>
        <ellipse cx="190" cy="68" rx="7" ry="14" transform="rotate(-40 190 68)"/>
        <ellipse cx="220" cy="70" rx="7" ry="14" transform="rotate(10 220 70)"/>
      </g>
      <!-- Label tag on sack -->
      <rect x="80" y="210" width="170" height="40" rx="6" fill="#0A1628" stroke="#F97316" stroke-width="1.5"/>
      <text x="165" y="235" fill="#FDBA74" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle">PEANUTS / MOONGPHALI</text>
    </g>

    <!-- Right Foreground Sack - Filled with Green Moong / Lentils -->
    <g transform="translate(860, 20)">
      <path d="M 10,100 Q 170,40 330,100 L 340,360 Q 170,390 0,360 Z" fill="url(#juteWeave)" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.85))"/>
      <path d="M 10,100 Q 170,50 330,100 Q 170,145 10,100 Z" fill="#D7B18E" stroke="#855835" stroke-width="2.5"/>
      <!-- Green Lentils Mound -->
      <ellipse cx="170" cy="100" rx="145" ry="38" fill="#15803D"/>
      <ellipse cx="170" cy="75" rx="100" ry="28" fill="#22C55E"/>
      <g fill="#166534">
        <circle cx="125" cy="92" r="3"/><circle cx="150" cy="98" r="3"/><circle cx="175" cy="90" r="3"/>
        <circle cx="200" cy="95" r="3"/><circle cx="225" cy="90" r="3"/><circle cx="160" cy="75" r="3"/>
        <circle cx="185" cy="72" r="3"/><circle cx="210" cy="76" r="3"/>
      </g>
      <!-- Label tag on sack -->
      <rect x="70" y="230" width="160" height="40" rx="6" fill="#0A1628" stroke="#10B981" stroke-width="1.5"/>
      <text x="150" y="255" fill="#6EE7B7" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle">GREEN MOONG DAL</text>
    </g>
  </g>
</svg>
