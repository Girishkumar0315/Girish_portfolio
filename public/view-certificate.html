      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;

    .btn-primary {
      background: #3b82f6;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);

    .cert-frame {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.12);

    .cert-img {
